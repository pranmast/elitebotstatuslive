<!DOCTYPE html>
<html>
<head>
    <title>v201.120: Pure Physics</title>
    <!-- CRITICAL: Pinned strictly to v4.1.1. Do NOT unpin or Version 5 update will delete addLineSeries() -->
    <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        body { background: #08090b; color: #e1e1e1; font-family: 'Courier New', monospace; margin: 0; }
        .header { background: #14151a; padding: 10px; border-bottom: 1px solid #2b2f3a; text-align: center; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px; }
        .card { background: #14151a; border: 1px solid #2b2f3a; border-radius: 4px; overflow: hidden; }
        .stats { padding: 10px; font-weight: bold; border-top: 1px solid #2b2f3a; background: #1a1c23; }
    </style>
</head>
<body>
    <div class="header">🛰️ 15m MOMENTUM GAUNTLET | v201.120 | <span id="clock">SYNCING...</span></div>
    <div class="grid" id="container"></div>

    <script>
    const charts = {};
    const series = {};

    const safeId = (sym) => sym.replace(/\//g, '_');

    async function pulse() {

        try {

            const res = await fetch(
                'https://raw.githubusercontent.com/pranmast/elitebotstatuslive/telemetry/data.json?nocache=' + Date.now()
            );

            const data = await res.json();

            document.getElementById('clock').innerText =
                "LAST DATA: " + data.last_update;

            Object.keys(data.fleet).forEach(sym => {

                const asset = data.fleet[sym];

                // ===== CREATE CHART =====
                if (!series[sym]) {
                    setupChart(sym);
                }

                if (!series[sym]) return;

                // ===== BUILD SIMPLE HISTORY =====
                // fallback if backend has no history
                if (!window.priceHistory) {
                    window.priceHistory = {};
                }

                if (!window.priceHistory[sym]) {
                    window.priceHistory[sym] = [];
                }

                const now = Math.floor(Date.now() / 1000);

                window.priceHistory[sym].push({
                    time: now,
                    value: asset.price
                });

                // Keep last 200 points
                if (window.priceHistory[sym].length > 200) {
                    window.priceHistory[sym].shift();
                }

                try {

                    series[sym].setData(
                        window.priceHistory[sym]
                    );

                    const color =
                        asset.roi > 0
                        ? '#00ff88'
                        : asset.roi < 0
                        ? '#ff4a4a'
                        : '#ffffff';

                    const statsEl = document.getElementById(
                        `stats-${safeId(sym)}`
                    );

                    if (statsEl) {

                        statsEl.innerHTML =
                            `
                            POS: ${asset.position}
                            |
                            ROI:
                            <span style="color:${color}">
                                ${asset.roi.toFixed(2)}%
                            </span>
                            `;
                    }

                } catch (err) {

                    console.error(
                        `Update fail on ${sym}:`,
                        err
                    );
                }
            });

        } catch (e) {

            console.error(
                "No Telemetry Connection:",
                e
            );
        }
    }

    function setupChart(sym) {

        const sId = safeId(sym);

        const container =
            document.getElementById('container');

        const card = document.createElement('div');

        card.className = 'card';

        const title = document.createElement('div');

        title.style.padding = '10px';

        title.innerText = sym;

        const chartDiv = document.createElement('div');

        chartDiv.id = `c-${sId}`;

        chartDiv.style.height = '350px';

        const statsDiv = document.createElement('div');

        statsDiv.className = 'stats';

        statsDiv.id = `stats-${sId}`;

        statsDiv.innerText = 'WAITING...';

        card.appendChild(title);

        card.appendChild(chartDiv);

        card.appendChild(statsDiv);

        container.appendChild(card);

        try {

            charts[sym] =
                LightweightCharts.createChart(
                    chartDiv,
                    {
                        width:
                            chartDiv.offsetWidth ||
                            (container.offsetWidth / 2 - 20),

                        height: 350,

                        layout: {
                            background: {
                                type: 'solid',
                                color: '#14151a'
                            },

                            textColor: '#d1d4dc'
                        },

                        grid: {
                            vertLines: {
                                color: '#2b2f3a'
                            },

                            horzLines: {
                                color: '#2b2f3a'
                            }
                        },

                        timeScale: {
                            timeVisible: true,
                            secondsVisible: true
                        }
                    }
                );

            series[sym] =
                charts[sym].addLineSeries({

                    color: '#2962FF',

                    lineWidth: 2
                });

        } catch (e) {

            console.error(
                `Chart Init Failed for ${sym}:`,
                e
            );

            delete charts[sym];
        }
    }

    setInterval(pulse, 2000);

    pulse();
</script>
</body>
</html>
